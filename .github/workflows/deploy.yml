name: Deploy Portfolio

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies for OG image generation
        run: |
          # The generate_og_images.py script likely requires certain libraries.
          # We will try to run it; if it fails, we'll refine the requirements.
          pip install Pillow

      - name: Generate Open Graph Images
        run: |
          python scripts/generate_og_images.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Deploy the root of the repository

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
